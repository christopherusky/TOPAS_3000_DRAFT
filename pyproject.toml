[project]
name = "TOPAS3000A"
version = "0.1.0"
description = "Clean JSON Schemas for TOPAS 3000A (Stage 1 focus)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.21",
    "pyyaml>=6.0.3",
    "jinja2>=3.1",
    # Pinned exactly: the version is stamped into every generated Python
    # SDK file's header, so any drift between developer
    # environments and CI breaks the drift workflow.
    "datamodel-code-generator==0.57.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "python-qpid-proton>=0.39",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
