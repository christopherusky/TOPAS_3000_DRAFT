# Conformance accounts for the authenticated A11 leg.
#
# Two principals so the harness can prove that the same
# commandCorrelationId from different authenticated users is two
# distinct commands, and that a self-asserted x-originator cannot move
# a command between them.
#
# Passwords are Artemis PBKDF2 hashes, which is the format the
# PropertiesLoginModule expects — plain text here does not fail
# loudly, it simply never authenticates ("Unable to validate user").
# Regenerate with: artemis mask --hash <password>
#
# Throw-away credentials for a broker that listens on localhost and
# holds no data: admin/admin, user-a/pw-a, user-b/pw-b. Not secrets,
# and not used anywhere else.

