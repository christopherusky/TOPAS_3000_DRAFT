asyncapi: 2.6.0
info:
  title: TOPAS 3000A
  version: 1.0.0
  description: "\nTOPAS 3000A is the successor to the UTMC standards and a modern replacement \nfor the legacy CORBA-based\
    \ UTMC interface between UTC \n(Urban Traffic Control) systems and the Common Database. \nThe standard aims to create\
    \ an open, interoperable environment \nfor intelligent traffic systems while addressing the limitations \nof the original\
    \ UTMC standards introduced from 1997.\n\nPublished by TOPAS (Traffic Open Products & Specifications). Scoped to\nthe\
    \ application-layer interface between UTC systems and UTMC systems \n(informally known as Common Database platforms).\n\
    \nA system that is TOPAS 3000A compliant is not required to be UTMCv1 \ncompliant, and vice versa. The two protocols are\
    \ not interoperable \nwithout a translation gateway.\n"
  contact:
    name: TOPAS Group
    url: https://topasgroup.org.uk/
  license:
    name: TOPAS Specification Licence
servers:
  production:
    url: amqps://{host}:{port}
    protocol: amqp
    protocolVersion: 1.0.0
    description: AMQP 1.0 broker with mTLS
    x-deploymentTimezone: Europe/London
    security:
    - mtls: []
    variables:
      host:
        description: AMQP broker hostname
      port:
        default: '5671'
        description: AMQPS port (TLS)
defaultContentType: application/json
