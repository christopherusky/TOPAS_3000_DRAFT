components:
  securitySchemes:
    mtls:
      type: X509
      description: 'Mutual TLS with X.509 client certificates, over TLS 1.3 only (TOPAS 3000A AC5-4). Both publisher and subscriber
        authenticate via client certificate. VPN is not required (TOPAS 3000A AC5-2).

        '
  messageTraits:
    topasEnvelope:
      description: 'Standard TOPAS 3000A message envelope. Routing metadata is carried in AMQP application-properties (not
        the JSON body) so brokers can filter without deserialising payloads.

        '
      headers:
        type: object
        properties:
          x-message-mode:
            type: string
            enum:
            - sync
            - delta
            description: 'Publication scope. ''sync'' = complete current state of all objects of this type; ''delta'' = only
              what changed. Payload schema is identical for both (A3).

              '
          x-content-type:
            type: string
            description: 'Payload schema reference matching the channel name + version, e.g. ''detector.measurement-v1.0''.

              '
          x-geo-tile:
            type: string
            description: 'Geographic tile code for location-based filtering (A2). Publisher computes from object location
              at publish time.

              '
          x-geo-tile-system:
            type: string
            enum:
            - geohash
            - s2
            - intercor
            description: 'Encoding system for x-geo-tile (A2). Required if x-geo-tile is set. Default recommendation: geohash.

              '
          x-sync-id:
            type: string
            format: uuid
            description: 'Identifies a sync batch (A5). All messages in the same sync share this ID. Required when x-message-mode
              is ''sync''.

              '
          x-sync-sequence:
            type: integer
            minimum: 1
            description: '1-based position of this message within the sync batch (A5). Required when x-message-mode is ''sync''.

              '
          x-sync-total:
            type: integer
            minimum: 1
            description: 'Total messages in the sync batch (A5). Consumer knows sync is complete when x-sync-sequence equals
              x-sync-total. Required when x-message-mode is ''sync''.

              '
          x-sync-request-id:
            type: integer
            minimum: 0
            description: 'Echoes the syncCorrelationId of the SyncRequest that triggered this batch. Present only on requested
              syncs; a publisher-initiated republication — on restart, or after a disconnect longer than its delta buffer
              — carries x-message-mode ''sync'' with no x-sync-request-id, which is how a subscriber tells the two apart.

              '
        required:
        - x-message-mode
        - x-content-type
        dependencies:
          x-geo-tile:
          - x-geo-tile-system
        if:
          properties:
            x-message-mode:
              const: sync
          required:
          - x-message-mode
        then:
          required:
          - x-sync-id
          - x-sync-sequence
          - x-sync-total
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: application/json
    topasRequestReply:
      description: 'Request/reply message. Carries no data-envelope headers. The only application property is the optional
        audit label x-originator.

        '
      headers:
        type: object
        properties:
          x-originator:
            type: string
            description: 'Identity of the system that sent the original command. Audit and tracing only (A11) — it is NOT
              how a response reaches its requester. Responses are addressed to the reply-to node supplied on the command,
              so they are delivered only to the requester rather than broadcast and filtered. This value is self-asserted
              application data: a command gateway SHOULD derive it from the authenticated mTLS principal and MUST reject a
              value that contradicts it. It MUST NOT be treated as a security primitive. Superseded A4.

              '
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: application/json
