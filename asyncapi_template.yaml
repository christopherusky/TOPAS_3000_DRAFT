# TOPAS 3000A AsyncAPI Template
# Hand-authored structural parts. Channels are generated by bin/emit_asyncapi.py.
#
# Author:     Christopher Kettell, TRL Software
# Date:       2026-10-03
# Version:    1.1

asyncapi: '2.6.0'

info:
  title: TOPAS 3000A
  version: '1.0.0'
  description: |
    
    TOPAS 3000A is the successor to the UTMC standards and a modern replacement 
    for the legacy CORBA-based UTMC interface between UTC 
    (Urban Traffic Control) systems and the Common Database. 
    The standard aims to create an open, interoperable environment 
    for intelligent traffic systems while addressing the limitations 
    of the original UTMC standards introduced from 1997.

    Published by TOPAS (Traffic Open Products & Specifications). Scoped to
    the application-layer interface between UTC systems and UTMC systems 
    (informally known as Common Database platforms).
    
    A system that is TOPAS 3000A compliant is not required to be UTMCv1 
    compliant, and vice versa. The two protocols are not interoperable 
    without a translation gateway.
  contact:
    name: TOPAS Group
    url: https://topasgroup.org.uk/
  license:
    name: TOPAS Specification Licence

servers:
  production:
    url: 'amqps://{host}:{port}'
    protocol: amqp
    protocolVersion: '1.0.0'
    description: AMQP 1.0 broker with mTLS
    # IANA time zone of the deployment this Broker serves. Subscribers use it
    # to bucket wall-clock time correctly across DST transitions; it cannot be
    # inferred from a message's UTC offset alone (BST and CEST are both +01:00).
    # See "Time and Time Zone Handling" in README.md.
    x-deploymentTimezone: 'Europe/London'
    security:
      - mtls: []
    variables:
      host:
        description: AMQP broker hostname
      port:
        default: '5671'
        description: AMQPS port (TLS)

defaultContentType: application/json

# Channels are generated by bin/emit_asyncapi.py — this empty placeholder
# satisfies AsyncAPI validation on the template file itself.
channels: {}

components:
  securitySchemes:
    mtls:
      type: X509
      description: >
        Mutual TLS with X.509 client certificates, over TLS 1.3 only
        (TOPAS 3000A AC5-4). Both publisher and subscriber authenticate via
        client certificate. VPN is not required (TOPAS 3000A AC5-2).

  messageTraits:
    topasEnvelope:
      description: >
        Standard TOPAS 3000A message envelope. Routing metadata is carried
        in AMQP application-properties (not the JSON body) so brokers can
        filter without deserialising payloads.
      headers:
        type: object
        properties:
          x-message-mode:
            type: string
            enum:
              - sync
              - delta
            description: >
              Publication scope. 'sync' = complete current state of all
              objects of this type; 'delta' = only what changed. Payload
              schema is identical for both (A3).
          x-content-type:
            type: string
            description: >
              Payload schema reference matching the channel name + version,
              e.g. 'detector.measurement-v1.0'.
          x-geo-tile:
            type: string
            description: >
              Geographic tile code for location-based filtering (A2).
              Publisher computes from object location at publish time.
          x-geo-tile-system:
            type: string
            enum:
              - geohash
              - s2
              - intercor
            description: >
              Encoding system for x-geo-tile (A2). Required if x-geo-tile
              is set. Default recommendation: geohash.
          x-sync-id:
            type: string
            format: uuid
            description: >
              Identifies a sync batch (A5). All messages in the same
              sync share this ID. Required when x-message-mode is 'sync'.
          x-sync-sequence:
            type: integer
            minimum: 1
            description: >
              1-based position of this message within the sync batch (A5).
              Required when x-message-mode is 'sync'.
          x-sync-total:
            type: integer
            minimum: 1
            description: >
              Total messages in the sync batch (A5). Consumer knows sync
              is complete when x-sync-sequence equals x-sync-total.
              Required when x-message-mode is 'sync'.
          x-sync-request-id:
            type: integer
            minimum: 0
            description: >
              Echoes the syncCorrelationId of the SyncRequest that
              triggered this batch. Present only on requested syncs;
              a publisher-initiated republication — on restart, or after a
              disconnect longer than its delta buffer — carries
              x-message-mode 'sync' with no x-sync-request-id, which is
              how a subscriber tells the two apart.
        required:
          - x-message-mode
          - x-content-type
        # x-geo-tile-system is required if x-geo-tile is set (A2).
        dependencies:
          x-geo-tile:
            - x-geo-tile-system
        # A sync batch must identify itself and its position (A5).
        if:
          properties:
            x-message-mode:
              const: sync
          required:
            - x-message-mode
        then:
          required:
            - x-sync-id
            - x-sync-sequence
            - x-sync-total
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: application/json

    # Command requests and responses, sync requests and SyncComplete. These are
    # not data messages: they are correlated by reply-to, message-id and
    # correlation-id and by their own payload identifiers (A11), so the data
    # envelope's mode and sync headers do not apply and are not required.
    topasRequestReply:
      description: >
        Request/reply message. Carries no data-envelope headers. The only
        application property is the optional audit label x-originator.
      headers:
        type: object
        properties:
          x-originator:
            type: string
            description: >
              Identity of the system that sent the original command.
              Audit and tracing only (A11) — it is NOT how a response
              reaches its requester. Responses are addressed to the
              reply-to node supplied on the command, so they are delivered
              only to the requester rather than broadcast and filtered.
              This value is self-asserted application data: a command
              gateway SHOULD derive it from the authenticated mTLS
              principal and MUST reject a value that contradicts it. It
              MUST NOT be treated as a security primitive. Superseded A4.
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: application/json
