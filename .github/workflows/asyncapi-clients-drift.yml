name: AsyncAPI Clients Drift

# Note: the earlier "Node.js no longer required" no longer
# holds: `make asyncapi-clients` shells out to quicktype
# via npx for the Java, C# and TypeScript SDKs, so this job pins Node
# explicitly rather than inheriting whatever the runner ships.
# Verifies that the committed asyncapi_clients/output/ tree is up to
# date with asyncapi.yaml + the generator + templates. If anything
# drifted, the build fails with a clear message.
#
# Triggers include 'trunk' because that is the active working branch
# in this repo (the existing two workflows trigger on main/master only;
# reconciling those is out of scope for this PR).
#
# Note: this workflow does NOT consume any untrusted input
# (github.event.*, head_ref, etc.) in any run: command — all run
# steps are static commands against checked-out files.

on:
  pull_request:
    branches: [trunk, main, master]
  push:
    branches: [trunk, main, master]

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      # The default shallow clone is enough: _gen_date
      # reads asyncapi.yaml's content hash from gen_stamp.json and makes
      # no git call at all, so no amount of history changes the stamp.
      # (an earlier approach needed fetch-depth: 0 for the commit-date lookup it
      # replaced; that lookup was itself the cross-repo drift bug.)
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync

      # quicktype runs via npx. Pinned so a runner default bump
      # cannot silently change generated output and fail this drift check.
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The Rust SDK is generated by cargo-typify, so this
      # job needs it too — `make asyncapi-clients` fails without it. Pinned
      # for the same reason as quicktype: an unpinned generator can change
      # committed output and fail this very check.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Pinned, like the other generators and tools: `stable` moves under
          # us and can turn this job red on a day nothing here changed. Matches
          # the toolchain the Rust SDK was verified against locally.
          toolchain: 1.97.0

      - name: Cache cargo-typify
        id: cache-typify
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.7.0-${{ runner.os }}

      - name: Install cargo-typify
        if: steps.cache-typify.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --version 0.7.0 --locked

      # Regenerate from empty, not over the top. The Java, C#, TypeScript and
      # Rust steps clear their own SDK tree, but the Python SDK and the
      # snippets do not, so a file the generator no longer produces there
      # would survive unchanged and the gate would never see it.
      # The SDKs are generated from the committed Schemas/. Regenerate those from
      # empty first, so a hand-edited or stale Schemas/ fails here and not only in
      # the Build Diagrams workflow.
      - name: Regenerate schemas from empty and verify no drift
        run: |
          rm -rf Schemas Schemas_asyncapi
          make schemas asyncapi
          if ! uv run python bin/check_drift.py Schemas/ Schemas_asyncapi/ asyncapi.yaml; then
            echo "::error::Schemas/, Schemas_asyncapi/ or asyncapi.yaml is out of date with the models."
            echo "Run 'make schemas asyncapi' locally and commit the result, including new files."
            exit 1
          fi

      - name: Clear the generated SDK tree so drift means regeneration, not overwrite
        run: rm -rf asyncapi_clients/output

      - name: Regenerate asyncapi-clients
        run: make asyncapi-clients

      # `git diff --exit-code` reports only differences in tracked files. It
      # misses a newly generated file that was never committed.
      # check_drift.py reports modified, deleted and untracked files alike
      # (tests/test_check_drift.py).
      - name: Verify no drift in committed output
        run: |
          if ! uv run python bin/check_drift.py asyncapi_clients/output/; then
            echo "::error::asyncapi_clients/output/ is out of date with asyncapi.yaml, the generator, or one of the templates."
            echo "Run 'rm -rf asyncapi_clients/output && make asyncapi-clients' locally and commit the result, including new files."
            exit 1
          fi
